backend:
  name: github
  repo: warezfr/afbtaxi
  branch: main
  base_url: https://www.afbtaxis.com
  auth_endpoint: /api/auth

media_folder: public/uploads
public_folder: /uploads

locale: fr

collections:
  - name: blog
    label: Articles de Blog
    folder: content/blog
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: title, widget: string }
      - { label: "Description (SEO)", name: description, widget: text }
      - { label: "Catégorie", name: category, widget: select, options: ["Tourisme & Culture", "Transport", "Guide Pratique", "Nature & Sport", "Gastronomie"] }
      - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: "Image principale", name: imageUrl, widget: image }
      - { label: "Tags", name: tags, widget: list, default: ["Fontainebleau", "AFB Taxis"] }
      - { label: "Contenu", name: body, widget: markdown }
